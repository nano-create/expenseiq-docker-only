version: '3.8'

services:

  mongo:
    image: mongo:7.0
    container_name: expenseiq-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: expenseiq

  backend:
    build: ./backend
    container_name: expenseiq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      PORT:       5000
      JWT_SECRET: expenseiq_super_secret_jwt_key_2024
      MONGO_URL:  mongodb://mongo:27017/expenseiq

  frontend:
    build: ./frontend
    container_name: expenseiq-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
